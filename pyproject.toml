[project]
name = "genai-learning"
version = "0.1.0"
description = "LangChain -> LangGraph -> RAG learning workspace"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "langchain-anthropic>=1.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-text-splitters>=1.0",
    "langchain-chroma>=1.0",
    "chromadb>=0.5",
    "pypdf>=5.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[dependency-groups]
dev = ["jupyter>=1.1", "ipykernel>=6.29", "ruff>=0.6"]

[tool.ruff]
line-length = 100
